name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      teacher: ${{ steps.filter.outputs.teacher }}
      student: ${{ steps.filter.outputs.student }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Classify changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          backend=false
          teacher=false
          student=false
          e2e=false

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            backend=true
            teacher=true
            student=true
            e2e=true
          else
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
            while IFS= read -r path; do
              case "$path" in
                api-server/*)
                  backend=true
                  e2e=true
                  ;;
                teacher-web/*)
                  teacher=true
                  e2e=true
                  ;;
                student-app/*)
                  student=true
                  e2e=true
                  ;;
                playwright-smoke/*)
                  e2e=true
                  ;;
                .github/workflows/ci.yml)
                  backend=true
                  teacher=true
                  student=true
                  e2e=true
                  ;;
              esac
            done < "${RUNNER_TEMP}/changed-files"
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "teacher=${teacher}" >> "$GITHUB_OUTPUT"
          echo "student=${student}" >> "$GITHUB_OUTPUT"
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api-server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  teacher-web:
    needs: changes
    if: needs.changes.outputs.teacher == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teacher-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: teacher-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  student-app:
    needs: changes
    if: needs.changes.outputs.student == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: student-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  playwright-e2e:
    needs: [changes, backend, teacher-web, student-app]
    if: >-
      ${{
        always() &&
        needs.changes.outputs.e2e == 'true' &&
        (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
        (needs.teacher-web.result == 'success' || needs.teacher-web.result == 'skipped') &&
        (needs.student-app.result == 'success' || needs.student-app.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api-server/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api-server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: playwright-smoke/package-lock.json

      - name: Install frontend deps
        run: |
          npm ci --prefix teacher-web
          npm ci --prefix student-app

      - name: Install Playwright deps
        working-directory: playwright-smoke
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Build frontends
        run: |
          npm run build --prefix teacher-web
          npm run build --prefix student-app

      - name: Start backend
        working-directory: api-server
        run: |
          cp .env.example .env
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "PID_API=$!" >> $GITHUB_ENV

      - name: Start teacher-web preview
        run: |
          npx vite preview --port 5173 --strictPort &
          echo "PID_TEACHER=$!" >> $GITHUB_ENV
        working-directory: teacher-web

      - name: Start student-app preview
        run: |
          npx vite preview --port 5174 --strictPort &
          echo "PID_STUDENT=$!" >> $GITHUB_ENV
        working-directory: student-app

      - name: Wait for services
        run: |
          ready=false
          for i in $(seq 1 30); do
            api_ok=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ 2>/dev/null || true)
            teacher_ok=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ 2>/dev/null || true)
            student_ok=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/ 2>/dev/null || true)
            echo "poll $i: api=$api_ok teacher=$teacher_ok student=$student_ok"
            if [ "$api_ok" = "200" ] && [ "$teacher_ok" != "000" ] && [ "$student_ok" != "000" ]; then
              echo "All services ready"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Services did not become ready within 60 seconds" >&2
            exit 1
          fi

      - name: Run smoke tests
        working-directory: playwright-smoke
        shell: bash
        run: |
          node smoke.js 2>&1 | tee smoke.log
          if grep -Eq '^\[FAIL\]|^\[WARN\] 无任务$|^\[WARN\] (教师端|学生端) UI 异常:' smoke.log; then
            echo "Smoke reported a core failure that did not exit nonzero." >&2
            exit 1
          fi

      - name: Kill background services
        if: always()
        run: |
          kill ${{ env.PID_API }} 2>/dev/null || true
          kill ${{ env.PID_TEACHER }} 2>/dev/null || true
          kill ${{ env.PID_STUDENT }} 2>/dev/null || true
