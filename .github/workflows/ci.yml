name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/api-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/api-server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  teacher-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/teacher-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: code/teacher-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  student-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/student-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: code/student-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
