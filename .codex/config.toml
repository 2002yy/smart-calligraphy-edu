# 项目级配置：.codex/config.toml
#
# 适用项目：
# - teacher-web：Vue 3 + Vite
# - student-app：Vue 3 + Vite
# - api-server：FastAPI + Pydantic + SQLAlchemy
# - ai-service：Python 推理服务
#
# 推荐原则：
# 1. 默认只保留“真正常用”的 MCP，避免 VS Code 里同时挂太多服务。
# 2. 文档查询类 MCP 常开；浏览器调试类 MCP 按需开。
# 3. 如果 IDE 已经内置某个 MCP，并且运行稳定，就不要在这里重复配一份。


# 可选：如果以后需要 OAuth 固定回调端口，再打开
# mcp_oauth_callback_port = 5555
# mcp_oauth_callback_url = "http://127.0.0.1:5555/callback"


# -------------------------------------------------------------------
# 一、建议常开：技术文档查询
# -------------------------------------------------------------------

# 1) Context7
# 用途：
# - 查 FastAPI / Pydantic / SQLAlchemy / Vue / Vite 等最新技术文档
# - 适合“我记得有这个写法，但想确认最新版”的场景
# 什么时候保留：
# - 你经常查框架文档时，建议常开
# 什么时候可以关：
# - 当前只做纯界面静态稿，不查技术文档时可临时关闭
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true


# 2) OpenAI Developer Docs
# 用途：
# - 查 Codex / MCP / OpenAI API / OpenAI 官方开发文档
# 什么时候保留：
# - 只要你在折腾 Codex、MCP、模型调用，这项就建议常开
# 什么时候可以关：
# - 当前阶段完全不碰 OpenAI 接口与工具链时
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled = true


# -------------------------------------------------------------------
# 二、浏览器自动化：优先保留 IDE 内置 Playwright
# -------------------------------------------------------------------

# 3) Playwright
# 用途：
# - 自动打开页面
# - 跑冒烟测试
# - 截图验收教师端 / 学生端页面
#
# 当前项目建议：
# - 如果你的 VS Code / Codex 环境里已经内置并且能正常启动
#   microsoft/playwright-mcp，就“保留内置版本”，这里不要重复配置。
# - 只有在“内置 Playwright 不可用”或者“你明确要接入自定义 Playwright MCP”
#   的时候，才另外写一段项目级配置。
#
# 什么时候保留 IDE 内置 Playwright：
# - 你已经能在 MCP 列表里看到 `microsoft/playwright` 正在运行
# - 能正常打开页面、截图、跑简单自动化
#
# 什么时候再单独写项目级 Playwright：
# - IDE 内置 Playwright 经常起不来
# - 你需要固定到某个自定义桥接地址或自定义启动方式
#
# 下面保留一个示例模板，默认注释掉：
#
# [mcp_servers.playwright]
# command = "npx"
# args = ["-y", "@playwright/mcp@latest"]
# startup_timeout_sec = 20
# tool_timeout_sec = 60
# enabled = false


# -------------------------------------------------------------------
# 三、浏览器调试：只在“前端报错排查”时启用
# -------------------------------------------------------------------

# 4) Chrome DevTools
# 用途：
# - 看浏览器 Console 报错
# - 抓网络请求
# - 看接口返回
# - 做页面截图
#
# 当前项目建议：
# - 平时默认关闭
# - 当你需要排查以下问题时再打开：
#   1. 前端页面空白
#   2. 控制台报错
#   3. 接口 401 / 404 / 500
#   4. 前端请求没有发出去
#   5. 想检查真实浏览器里的 DOM / 网络日志
#
# 注意：
# - 这一项只有在你本地已经有一个“可访问的 MCP 地址”时才启用
# - 例如某些本地桥接器会暴露 http://localhost:3000/mcp
# - 如果这个地址本身不存在，就保持 enabled = false
[mcp_servers.chrome_devtools]
url = "http://localhost:3000/mcp"
enabled_tools = ["open", "list_pages", "select_page", "evaluate_script", "get_console_logs", "get_network_logs", "screenshot"]
startup_timeout_sec = 20
tool_timeout_sec = 45
enabled = false


# -------------------------------------------------------------------
# 四、这个项目的最小推荐组合
# -------------------------------------------------------------------
#
# 日常开发推荐只保留：
# - context7 = true
# - openaiDeveloperDocs = true
# - IDE 内置 playwright = 保留
# - chrome_devtools = false（排错时再开）
#
# 也就是说，最适合你这套项目的 MCP 思路不是“装得越多越好”，
# 而是“文档查询常开 + 浏览器工具按需开 + 其余无关项尽量关”。
